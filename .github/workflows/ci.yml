name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  framework-and-consumer:
    name: framework / consumer
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
          cache-dependency-path: |
            build.sbt
            project/**
            integration-tests/maven-consumer/build.sbt
            integration-tests/maven-consumer/project/**

      - uses: sbt/setup-sbt@v1

      # 版本号只是 Maven-local 往返验证的标签，与发布版本线无关；固定为 0.0.0-local
      # 可避免它每次发布后变成一个看起来在验证旧版本的过期字面量。
      - name: Format, test, and publish to Maven-local
        run: sbt -batch 'set ThisBuild / version := "0.0.0-local"; scalafmtCheckAll; scalafmtSbtCheck; testFull; publishM2'

      - name: Compile independent Maven consumer
        working-directory: integration-tests/maven-consumer
        env:
          ZYBLW_AGENT_VERSION: 0.0.0-local
        run: sbt -batch compile

  dashboard:
    name: dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: modules/agent-dashboard

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: modules/agent-dashboard/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci

      - name: Typecheck, lint, and build
        run: npx tsc --noEmit && npm run lint && npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser contract
        run: npm run test:e2e

  postgres:
    name: postgres
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUN_POSTGRES_INTEGRATION: "1"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
          cache-dependency-path: |
            build.sbt
            project/**

      - uses: sbt/setup-sbt@v1

      - name: PostgreSQL persistence and failure contracts
        run: sbt -batch postgres/testFull
