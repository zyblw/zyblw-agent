name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  framework-and-consumer:
    name: framework / consumer
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
          cache-dependency-path: |
            build.sbt
            project/**
            integration-tests/maven-consumer/build.sbt
            integration-tests/maven-consumer/project/**

      - uses: sbt/setup-sbt@v1

      - name: Validate production evidence manifest
        run: .github/scripts/verify-local-evidence.sh --manifest

      - name: Validate Docker deployment contracts
        run: |
          ./deploy/docker/test-preflight.sh
          docker compose --env-file deploy/docker/env.example -f deploy/docker/compose.business.yml config --quiet
          ZYBLW_AGENT_IMAGE=ghcr.io/example/zyblw-agent:test \
            ZYBLW_AGENT_MIGRATION_USER=zyblw_migrate \
            ZYBLW_AGENT_MIGRATION_PASSWORD=test-only-migration-password \
            docker compose --env-file deploy/docker/env.example -f deploy/docker/compose.external-db.yml config --quiet
          ZYBLW_AGENT_MIGRATION_PASSWORD=test-only-migration-password \
            docker compose --env-file deploy/docker/env.example -f deploy/docker/compose.staging.yml config --quiet

      - name: RAG runtime security and eval gates
        run: >-
          sbt -batch
          'evals/testOnly com.zyblw.agent.evals.RagRuntimeEvalSpec;
          rag/testOnly com.zyblw.agent.rag.RagSecuritySpec com.zyblw.agent.rag.RagRuntimeSpineSpec'

      - name: Format, test, and publish the current candidate to Maven-local
        run: sbt -batch 'set ThisBuild / version := "0.0.0-local"; scalafmtCheckAll; scalafmtSbtCheck; testFull; publishM2'

      - name: Generate stable OpenAPI revision
        run: >-
          sbt -batch
          'http/Test/runMain com.zyblw.agent.http.contract.OpenApiSnapshotCli
          ../../target/agent-http-openapi-current.json'

      - name: Check stable OpenAPI compatibility
        if: github.event_name == 'pull_request'
        uses: oasdiff/oasdiff-action/breaking@v0.1.17
        with:
          base: origin/${{ github.base_ref }}:modules/agent-zio-http/src/test/resources/openapi/agent-http-v1.2.0.json
          revision: target/agent-http-openapi-current.json
          fail-on: WARN
          review: false

      - name: Compile independent Maven consumer
        working-directory: integration-tests/maven-consumer
        env:
          ZYBLW_AGENT_VERSION: 0.0.0-local
        run: sbt -batch compile

  dashboard:
    name: dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: modules/agent-dashboard

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26.8.1"
          cache: npm
          cache-dependency-path: modules/agent-dashboard/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci

      # `LayoutProps` and the other route-aware helpers are generated into `.next/types`, so a bare
      # `tsc --noEmit` only passes on a machine that already ran a build. `next typegen` produces
      # them without building, which keeps type checking a real gate on a clean checkout.
      - name: Typecheck, lint, and build
        run: npm run typecheck && npm run lint && npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser contract
        run: npm run test:e2e && npm run test:e2e:host

  eval-smoke:
    name: eval closed-loop smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
          cache-dependency-path: |
            build.sbt
            project/**

      - uses: sbt/setup-sbt@v1

      - name: Public eval fixtures and file-backend release gate
        run: ./integration-tests/eval-release-gate-smoke.sh

  postgres:
    name: postgres
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUN_POSTGRES_INTEGRATION: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
          cache-dependency-path: |
            build.sbt
            project/**

      - uses: sbt/setup-sbt@v1

      - name: PostgreSQL persistence and failure contracts
        run: sbt -batch postgres/testFull

  process-kill-recovery:
    name: process kill / database restart recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
          cache-dependency-path: |
            build.sbt
            project/**

      - uses: sbt/setup-sbt@v1

      - name: Process-death plus database-restart recovery
        run: |
          timeout 10m ./integration-tests/command-worker-kill-recovery.sh --restart-postgres
          timeout 10m ./integration-tests/workflow-wake-worker-kill-recovery.sh --restart-postgres

  durable-worker-soak:
    name: durable worker bounded soak
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
          cache-dependency-path: |
            build.sbt
            project/**

      - uses: sbt/setup-sbt@v1

      - name: Multi-worker PostgreSQL soak and latency gates
        run: timeout 10m ./integration-tests/durable-worker-soak.sh

  workflow-wake-worker-soak:
    name: workflow wake worker bounded soak
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
          cache-dependency-path: |
            build.sbt
            project/**

      - uses: sbt/setup-sbt@v1

      - name: Multi-worker Workflow wake soak and latency gates
        run: timeout 10m ./integration-tests/workflow-wake-worker-soak.sh
