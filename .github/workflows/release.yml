name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'zyblw/zyblw-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    environment: maven-central

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
          cache-dependency-path: |
            build.sbt
            project/**
            integration-tests/maven-consumer/build.sbt
            integration-tests/maven-consumer/project/**

      - uses: sbt/setup-sbt@v1

      - name: Validate semantic-version tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be vMAJOR.MINOR.PATCH or a SemVer prerelease." >&2
            exit 1
          fi

      - name: Validate release secret shapes
        shell: bash
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
        run: |
          set -euo pipefail
          for name in PGP_PASSPHRASE PGP_SECRET SONATYPE_PASSWORD SONATYPE_USERNAME; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required maven-central environment secret is missing: ${name}" >&2
              exit 1
            fi
          done

          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          if ! printf '%s' "$PGP_SECRET" | base64 --decode > "$key_file" 2>/dev/null; then
            echo "PGP_SECRET must be the single-line base64 encoding of the armored private key." >&2
            exit 1
          fi
          if ! grep -qx -- '-----BEGIN PGP PRIVATE KEY BLOCK-----' "$key_file"; then
            echo "PGP_SECRET decoded successfully, but it is not an armored PGP private key." >&2
            exit 1
          fi

      - name: Verify release artifacts
        env:
          RUN_POSTGRES_INTEGRATION: "1"
        run: sbt -batch 'scalafmtCheckAll; scalafmtSbtCheck; testFull; publishM2'

      - name: Compile independent Maven consumer
        working-directory: integration-tests/maven-consumer
        shell: bash
        run: |
          export ZYBLW_AGENT_VERSION="${GITHUB_REF_NAME#v}"
          sbt -batch compile

      - name: Sign and publish to Maven Central
        run: sbt -batch ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
