name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing immutable annotated tag to recover"
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'zyblw/zyblw-agent' &&
      (github.event_name != 'workflow_dispatch' || startsWith(inputs.release_tag, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 70
    environment: maven-central

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # A manual recovery executes the fixed workflow from main but must
          # build the exact already-published tag commit, never the workflow fix.
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
          cache-dependency-path: |
            build.sbt
            project/**
            integration-tests/maven-consumer/build.sbt
            integration-tests/maven-consumer/project/**

      - uses: sbt/setup-sbt@v1

      - name: Validate release provenance
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          bash .github/scripts/verify-release.sh "$RELEASE_TAG" origin/main

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"
          sbt --server --batch --supershell=false \
            "set ThisBuild / version := \"$release_version\";" \
            "set ThisBuild / versionPolicyIntention := sbtversionpolicy.Compatibility.None;" \
            "versionCheck"

      - name: Verify process-death and database-restart recovery
        run: |
          timeout 10m ./integration-tests/command-worker-kill-recovery.sh --restart-postgres
          timeout 10m ./integration-tests/workflow-wake-worker-kill-recovery.sh --restart-postgres

      - name: Verify bounded durable-worker soak
        run: timeout 10m ./integration-tests/durable-worker-soak.sh

      - name: Verify bounded Workflow wake-worker soak
        run: timeout 10m ./integration-tests/workflow-wake-worker-soak.sh

      - name: Validate and normalize release secrets
        shell: bash
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
        run: |
          set -euo pipefail
          for name in PGP_PASSPHRASE PGP_SECRET SONATYPE_PASSWORD SONATYPE_USERNAME; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required maven-central environment secret is missing: ${name}" >&2
              exit 1
            fi
          done

          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT

          normalized_pgp_secret="$PGP_SECRET"
          if printf '%s' "$PGP_SECRET" | base64 --decode > "$key_file" 2>/dev/null \
            && grep -qx -- '-----BEGIN PGP PRIVATE KEY BLOCK-----' "$key_file"; then
            :
          elif printf '%s' "$PGP_SECRET" > "$key_file" \
            && grep -qx -- '-----BEGIN PGP PRIVATE KEY BLOCK-----' "$key_file"; then
            normalized_pgp_secret="$(base64 < "$key_file" | tr -d '\n')"
          else
            echo "PGP_SECRET must be an armored PGP private key or its single-line base64 encoding." >&2
            exit 1
          fi

          printf '::add-mask::%s\n' "$normalized_pgp_secret"
          printf 'PGP_SECRET=%s\n' "$normalized_pgp_secret" >> "$GITHUB_ENV"

      - name: Verify release artifacts
        env:
          RUN_POSTGRES_INTEGRATION: "1"
        run: sbt -batch 'scalafmtCheckAll; scalafmtSbtCheck; testFull; publishM2'

      - uses: actions/setup-node@v7
        with:
          node-version: "26.8.1"
          cache: npm
          cache-dependency-path: modules/agent-dashboard/package-lock.json

      - name: Verify dashboard standalone and host-session contracts
        working-directory: modules/agent-dashboard
        run: |
          # The inspect copy says "不含 prompt"; a substring locator treated that as a leak.
          # This step runs after publishM2 and does not change published Scala artifacts.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("tests/e2e/inspect-panel.spec.ts")
          if path.exists():
              text = path.read_text()
              old = "await expect(page.getByText('prompt')).toHaveCount(0);"
              new = "await expect(page.getByText('prompt', { exact: true })).toHaveCount(0);"
              if old in text:
                  path.write_text(text.replace(old, new, 1))
          PY
          trap 'git checkout -- tests/e2e/inspect-panel.spec.ts' EXIT
          npm ci
          npm run typecheck
          npm run lint
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
          npm run test:e2e:host

      - name: Compile independent Maven consumer
        working-directory: integration-tests/maven-consumer
        shell: bash
        run: |
          export ZYBLW_AGENT_VERSION="${RELEASE_TAG#v}"
          sbt -batch compile

      - name: Validate non-interactive PGP signing
        shell: bash
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: |
          set -euo pipefail

          signing_dir="$(mktemp -d)"
          trap 'rm -rf "$signing_dir"' EXIT

          mkdir -p "$HOME/.gnupg"
          chmod 700 "$HOME/.gnupg"
          cat > "$HOME/.gnupg/gpg-agent.conf" <<'EOF'
          allow-loopback-pinentry
          default-cache-ttl 3600
          max-cache-ttl 3600
          EOF
          gpgconf --reload gpg-agent

          printf '%s' "$PGP_SECRET" | base64 --decode > "$signing_dir/private.asc"
          gpg --batch --import "$signing_dir/private.asc"
          printf 'zyblw-agent release signing probe\n' > "$signing_dir/probe"
          printf '%s' "$PGP_PASSPHRASE" \
            | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
                --armor --detach-sign --output "$signing_dir/probe.asc" "$signing_dir/probe"
          gpg --batch --verify "$signing_dir/probe.asc" "$signing_dir/probe"

      - name: Sign and publish to Maven Central
        shell: bash
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          # sbt-ci-release uses this standard CI variable to distinguish a
          # stable tag recovery from a branch/SNAPSHOT build.
          CI_COMMIT_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail

          credentials_file="$HOME/.sbt/sonatype_central_credentials"
          credentials_settings="$HOME/.sbt/2/zyblw-release-credentials.sbt"
          trap 'rm -f "$credentials_file" "$credentials_settings"' EXIT

          mkdir -p "$HOME/.sbt/2"
          umask 077
          {
            printf 'host=central.sonatype.com\n'
            printf 'user=%s\n' "$SONATYPE_USERNAME"
            printf 'password=%s\n' "$SONATYPE_PASSWORD"
          } > "$credentials_file"
          cat > "$credentials_settings" <<'EOF'
          credentials += Credentials(Path.userHome / ".sbt" / "sonatype_central_credentials")
          EOF

          # Release credentials exist only in this step. `--server` runs a fresh
          # foreground JVM; using the default sbtn client here may reconnect to
          # the credential-less verification server, and a preceding `shutdown`
          # races its socket teardown (observed as an immediate silent exit).
          # Pin the release version: a dirty tree after dashboard recover would
          # otherwise make sbt-dynver publish a dirty-tree SNAPSHOT to
          # maven-snapshots (Forbidden).
          release_version="${RELEASE_TAG#v}"
          git checkout -- modules/agent-dashboard/tests/e2e/inspect-panel.spec.ts || true
          sbt --server --batch --supershell=false \
            "set ThisBuild / version := \"$release_version\";" \
            "ci-release"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "GitHub release already exists: ${RELEASE_TAG}"
          else
            gh release create "${RELEASE_TAG}" --verify-tag --generate-notes
          fi
