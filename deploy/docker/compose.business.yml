# 业务接入拓扑：Docker 启动 Agent，直接连接你已部署的 PostgreSQL。
# 不创建数据库，不要求 PgBouncer，也不宣称主备/滚动发布已验证。
name: zyblw-agent-business

services:
  migrate:
    image: ${ZYBLW_AGENT_IMAGE:-zyblw-agent-support:local}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ZYBLW_AGENT_RUNTIME_MODE: live
      ZYBLW_AGENT_JDBC_URL: ${ZYBLW_AGENT_JDBC_URL:?set ZYBLW_AGENT_JDBC_URL}
      ZYBLW_AGENT_DB_USER: ${ZYBLW_AGENT_MIGRATION_USER:-${ZYBLW_AGENT_DB_USER:?set ZYBLW_AGENT_DB_USER}}
      ZYBLW_AGENT_DB_PASSWORD_ENV: ZYBLW_AGENT_DB_PASSWORD
      ZYBLW_AGENT_DB_PASSWORD: ${ZYBLW_AGENT_MIGRATION_PASSWORD:-${ZYBLW_AGENT_DB_PASSWORD:?set ZYBLW_AGENT_DB_PASSWORD}}
    command: ["migrate"]
    restart: "no"

  support:
    image: ${ZYBLW_AGENT_IMAGE:-zyblw-agent-support:local}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ZYBLW_AGENT_RUNTIME_MODE: live
      ZYBLW_AGENT_AUTH_MODE: trusted-headers
      ZYBLW_AGENT_HTTP_PORT: "8080"
      ZYBLW_AGENT_WORKER_ID: ${ZYBLW_AGENT_WORKER_ID:-support-business-1}
      ZYBLW_AGENT_JDBC_URL: ${ZYBLW_AGENT_JDBC_URL:?set ZYBLW_AGENT_JDBC_URL}
      ZYBLW_AGENT_DB_USER: ${ZYBLW_AGENT_DB_USER:?set ZYBLW_AGENT_DB_USER}
      ZYBLW_AGENT_DB_PASSWORD_ENV: ZYBLW_AGENT_DB_PASSWORD
      ZYBLW_AGENT_DB_PASSWORD: ${ZYBLW_AGENT_DB_PASSWORD:?set ZYBLW_AGENT_DB_PASSWORD}
      # 二选一：配置驱动的多端点/中转站，或单一 OPENAI_* 兼容端点。
      ZYBLW_AGENT_PROVIDER_ENDPOINTS_JSON: ${ZYBLW_AGENT_PROVIDER_ENDPOINTS_JSON:-}
      RELAY_API_KEY: ${RELAY_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GLM_API_KEY: ${GLM_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      # trusted-headers 只能由可信反代写入；默认不允许绕过反代从外网直连。
      - "${ZYBLW_AGENT_BIND_ADDRESS:-127.0.0.1}:${ZYBLW_AGENT_HTTP_PORT:-8080}:8080"
    command: ["serve"]
    restart: unless-stopped
    stop_grace_period: 25s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
