# 连接宿主自管 PostgreSQL 的 Docker/VM 部署。数据库与备份由宿主运维，不在本文件中创建。
name: zyblw-agent-external-db

services:
  migrate:
    image: ${ZYBLW_AGENT_IMAGE:?set ZYBLW_AGENT_IMAGE}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ZYBLW_AGENT_RUNTIME_MODE: live
      ZYBLW_AGENT_JDBC_URL: ${ZYBLW_AGENT_JDBC_URL:?set ZYBLW_AGENT_JDBC_URL}
      ZYBLW_AGENT_DB_USER: ${ZYBLW_AGENT_MIGRATION_USER:?set ZYBLW_AGENT_MIGRATION_USER}
      ZYBLW_AGENT_DB_PASSWORD_ENV: ZYBLW_AGENT_DB_PASSWORD
      ZYBLW_AGENT_DB_PASSWORD: ${ZYBLW_AGENT_MIGRATION_PASSWORD:?set ZYBLW_AGENT_MIGRATION_PASSWORD}
    command: ["migrate"]
    restart: "no"

  support:
    image: ${ZYBLW_AGENT_IMAGE:?set ZYBLW_AGENT_IMAGE}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ZYBLW_AGENT_RUNTIME_MODE: live
      ZYBLW_AGENT_AUTH_MODE: trusted-headers
      ZYBLW_AGENT_HTTP_PORT: "8080"
      ZYBLW_AGENT_WORKER_ID: ${ZYBLW_AGENT_WORKER_ID:?set unique worker id per replica}
      ZYBLW_AGENT_JDBC_URL: ${ZYBLW_AGENT_JDBC_URL:?set ZYBLW_AGENT_JDBC_URL}
      ZYBLW_AGENT_DB_USER: ${ZYBLW_AGENT_DB_USER:?set ZYBLW_AGENT_DB_USER}
      ZYBLW_AGENT_DB_PASSWORD_ENV: ZYBLW_AGENT_DB_PASSWORD
      ZYBLW_AGENT_DB_PASSWORD: ${ZYBLW_AGENT_DB_PASSWORD:?set ZYBLW_AGENT_DB_PASSWORD}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:?set OPENAI_BASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "${ZYBLW_AGENT_HTTP_PORT:-8080}:8080"
    command: ["serve"]
    stop_grace_period: 25s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s
